[workspace]
resolver = "2"
members = [
    "crates/iam-client",
    "crates/iam-protocol",
    "crates/iam-core",
    "crates/iam-loop",
    "crates/iam-store",
    "crates/iam-gateway",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
bytes = "1"
hex = "0.4"
hmac = "0.12"
prost = "0.13"
prost-types = "0.13"
sha2 = "0.10"
thiserror = "2"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
uuid = { version = "1", features = ["v7"] }
