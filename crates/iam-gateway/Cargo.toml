[package]
name = "iam-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TCP and TLS ingress for the IAM protocol"

[dependencies]
hex.workspace = true
iam-core = { path = "../iam-core" }
iam-protocol = { path = "../iam-protocol" }
iam-store = { path = "../iam-store" }
prost.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls.workspace = true

[dev-dependencies]
iam-client = { path = "../iam-client" }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
sha2.workspace = true
sqlx = { version = "=0.8.6", default-features = false, features = ["mysql", "runtime-tokio-rustls"] }
tempfile = "3"
url = "2"
